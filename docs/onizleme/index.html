ük var. Yağmurda sürücülerin görüşü daralır; ışıkların gündüz de yansın.\n\n🛒 İhtiyacın olan parça ve aksesuarlar profildeki linkte.\n\n📌 Bu kuralları kaydet, ilk yağmurlu günde aklında olsun.\n\n📍 NITRO Bisiklet · Köyceğiz / Muğla · bisiklet satış ve servis\n\n#köyceğiz #ortaca #bisikletbakımı #bisikletipuçları #bisikletsevenler","alt":"Islak zeminde güvenli bisiklet sürüşü için beş kuralı anlatan kaydırmalı bilgi görseli.","alts":["Islak zeminde güvenli bisiklet sürüşü için beş kuralı anlatan kaydırmalı bilgi görseli.","1. Erken ve Yumuşak Frenle: Islakta fren daha geç tutar. Freni her zamankinden erken sık, baskıyı yavaş yavaş artır. Ani ve sert fren tekerleği kilitleyebilir.","2. Viraja Girmeden Yavaşla: Frenlemeyi viraja girmeden, bisiklet dik dururken bitir. Virajın içinde fren yapmak ya da fazla yatmak tekerleği kaydırabilir.","3. Kaygan Yüzeylere Dikkat: Boyalı yol çizgileri, rögar kapakları ve ıslak yapraklar çok kaygandır. Üzerlerinden düz geç; o sırada fren yapma, gidonu çevirme.","4. Basıncı Biraz Düşür: Lastiği üst sınıra kadar şişirme. Yanakta yazan aralığın içinde kalarak basıncı biraz düşürmek ıslak zeminde tutunmayı artırır.","5. Işığını Yak, Görünür Ol: Yağmurda sürücüler seni daha geç fark eder. Gündüz bile ön ve arka ışığını yak; açık renkli ya da reflektörlü kıyafet giy.","Özetle: Islakta her şeyi biraz erkene al: erken frenle, yumuşak dön, görünür ol.","İhtiyacın olan parça ve aksesuarlar profildeki linkte."],"link":"https://nitrobisiklet.com/magaza/?utm_source=instagram&utm_medium=social&utm_campaign=ipucu&utm_content=2026-12-02-post-1930","bio_link":"https://nitrobisiklet.com/magaza/?utm_source=instagram&utm_medium=bio&utm_campaign=ipucu&utm_content=2026-12-02-post-1930","channel":"api","ref":"islak-zemin","rule":"ipucu","status":"planned","suite_scheduled":true,"products":[]},{"id":"2026-12-02-story-1930","date":"2026-12-02","time":"19:30","type":"story","format":"story","theme":"promo","kicker":"Şimdi akışta","title":"Yeni rehber akışta","m D.cal.forEach(function(c){BY[c.id]=c;(DAYS[c.date]=DAYS[c.date]||[]).push(c)});ORDER=Object.keys(DAYS).sort();

  else h+='<div class="t none">post yok</div>';

  h+='</div></a>'});
 if(!ORDER.length)h+='<div class="empty">Takvim boş. Plan görevi çalışınca burada görünecek.</div>';app.innerHTML=h}
function pager(day){var i=ORDER.indexOf(day),a=ORDER[i-1],b=ORDER[i+1];
 return '<div class="pager">'+(a?'<a href="#/gun/'+a+'">← '+esc(dl(a).split(' ').slice(0,2).join(' '))+'</a>':'<span></span>')+(b?'<a href="#/gun/'+b+'">'+esc(dl(b).split(' ').slice(0,2).join(' '))+' →</a>':'<span></span>')+'</div>'}
function vGun(day){nav('gun');if(!DAYS[day]){day=ORDER.filter(function(d){return d>=D.today})[0]||ORDER[0]}
 if(!day){app.innerHTML='<div class="empty">Takvim boş.</div>';return}
 var h='<h1>'+esc(dl(day))+'</h1>'+pager(day)+'<a class="btn" href="#/story/'+day+'">Story\'leri tam ekran izle</a><h2>Günün akışı</h2>';
 DAYS[day].forEach(function(c){var p=c.products[0];
  h+='<a class="row" href="'+(c.type==='post'?'#/p/'+c.id:'#/story/'+day+'/'+c.id)+'"><img loading="lazy" src="'+R+esc(c.thumb)+'" alt=""><div class="x"><span class="m">'+esc(c.time)+' · '+esc(c.kicker||TEMA[c.theme])+'</span><b>'+esc(c.title||'')+'</b>'+
   (p?'<small>'+esc(p.name)+(c.products.length>1?' +'+(c.products.length-1):' · '+esc(p.price)+' · '+esc(p.code))+'</small>':'')+chips(c)+'</div></a>'});
 app.innerHTML=h+pager(day)}
function vPost(id){nav('');var c=BY[id];if(!c){app.innerHTML='<div class="empty">Kayıt bulunamadı.</div>';return}
 var n=c.media.length,h='<p><a href="#/gun/'+c.date+'">← '+esc(dl(c.date))+'</a></p><div class="ig"><div class="igh"><img src="'+R+'logo.png" alt=""><div>'+esc(D.user)+'<small>'+esc(dl(c.date))+' · '+esc(c.time)+'</small></div></div><div class="car" id="car">';
 c.media.forEach(function(m){h+=/\.mp4$/.test(m)?'<video controls playsinline muted loop poster="'+R+esc(c.cover)+'" src="'+R+esc(m)+'"></video>':'<img loading="lazy" src="'+R+esc(m)+'" alt="">'});
 h+='</div><div class="cnt" id="cnt">'+(n>1?'1 / '+n+' · kaydır':esc(TUR[c.format]))+'</div><div class="cap"><b>'+esc(D.user)+'</b> '+esc(c.caption||'')+'</div></div>';
 h+='<div class="box"><label>Durum</label>'+chips(c)+(c.audit?'<ol>'+c.audit.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ol>':'');
 if(c.products.length){h+='<label>Ürün'+(c.products.length>1?'ler':'')+'</label><ol>'+c.products.map(function(p){return '<li><a href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a> · '+esc(p.price)+' · '+esc(p.code)+(p.label?' · '+esc(p.label):'')+'</li>'}).join('')+'</ol>'}
 if(c.link)h+='<label>Bağlantı (UTM)</label><a href="'+esc(c.link)+'" target="_blank" rel="noopener">'+esc(c.link)+'</a>';
 h+='<label>Açıklama</label>'+(c.caption||'').length+' karakter · '+((c.caption||'').match(/#[^\s#]+/g)||[]).length+' etiket';
 if(c.alts&&c.alts.length)h+='<label>Alt metinler</label><ol>'+c.alts.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ol>';
 h+='<label>Kimlik</label>'+esc(c.id)+' · kural: '+esc(c.rule)+'</div>';app.innerHTML=h;
 var car=document.getElementById('car');if(n>1)car.addEventListener('scroll',function(){document.getElementById('cnt').textContent=(Math.round(car.scrollLeft/car.clientWidth)+1)+' / '+n})}
function vProfil(){nav('profil');var ps=D.cal.filter(function(c){return c.type==='post'}).sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)});
 var h='<h1>Profil ızgarası</h1><p>Takvim tamamlandığında profilin görünümü (en yeni üstte, 3:4 kırpılmış).</p><div class="prof"><img src="'+R+'logo.png" alt=""><div><b>'+esc(D.user)+'</b><p>NITRO Bisiklet · Köyceğiz</p><p>Bisiklet satış ve servis</p><p><a href="'+R+'index.html">'+esc(D.bio)+'</a></p></div></div><div class="grid">';
 ps.forEach(function(c){var d=dt(c.date);h+='<a href="#/p/'+c.id+'"><img loading="lazy" src="'+R+esc(c.thumb)+'" alt=""><i>'+esc(TUR[c.format])+'</i><u>'+d.getDate()+' '+AY[d.getMonth()].slice(0,3)+'</u></a>'});
 app.innerHTML=h+'</div>'}
function vStory(day,id){nav('');var ss=stories(day);if(!ss.length){app.innerHTML='<div class="empty">Bu gün için story yok. <a href="#/takvim">Takvime dön</a></div>';return}
 var i=Math.max(0,ss.map(function(c){return c.id}).indexOf(id)),alt=false,el=document.createElement('div');el.className='sv';document.body.appendChild(el);
 function close(){if(el.parentNode)el.parentNode.removeChild(el)}
 function draw(){var c=ss[i],src=(c.media_link&&!alt)?c.media_link:c.media[0],st=c.sticker;
  var h='<div class="fr"><div class="pb">'+ss.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>'}).join('')+'</div><div class="hd"><span>'+esc(D.user)+' · '+esc(c.time)+'</span><a href="#/gun/'+day+'" id="sx">×</a></div><img src="'+R+esc(src)+'" alt="">';
  if(st&&!alt)h+='<a class="stk" target="_blank" rel="noopener" href="'+esc(st.url)+'" style="left:'+(st.x*100)+'%;top:'+(st.y*100)+'%">🔗 '+esc(st.text)+'</a>';
  h+='<div class="nv l" id="sl"></div><div class="nv r" id="sr"></div><div class="ft">'+esc(c.kicker||TEMA[c.theme])+' · '+(c.channel==='suite'?'Business Suite, link çıkartmalı':'API')+(c.audit?' · DENETİM: '+c.audit.length+' bulgu':'')+
   (c.media_link?'<br><button id="sa">'+(alt?'Link çıkartmalı sürümü göster':'API yedeğini göster (“Link profilde”)')+'</button>':'')+'</div></div>';
  el.innerHTML=h;document.getElementById('sl').onclick=function(){if(i>0){i--;alt=false;draw()}};
  document.getElementById('sr').onclick=function(){if(i<ss.length-1){i++;alt=false;draw()}else{location.hash='#/gun/'+day}};
  var sa=document.getElementById('sa');if(sa)sa.onclick=function(){alt=!alt;draw()}}
 draw();window.addEventListener('hashchange',close,{once:true})}
function route(){var old=document.querySelector('.sv');if(old)old.parentNode.removeChild(old);
 var p=(location.hash||'#/takvim').replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
 if(p[0]==='gun')vGun(p[1]);else if(p[0]==='p')vPost(p.slice(1).join('/'));else if(p[0]==='profil')vProfil();
 else if(p[0]==='story'){vGun(p[1]);vStory(p[1],p[2])}else vTakvim()}
window.addEventListener('hashchange',route);route();
</script></body></html>
