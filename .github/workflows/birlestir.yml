name: Bulut dalını main'e al

# Bulut oturumları yalnız claude/… dallarına push edebilir. Depo sahibi birleştirmeye önceden onay verdi:
# bu iş akışı o dalı main'e alır; tetik.txt değiştiyse istenen görevi de başlatır.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: birlestir
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Birleştir ve görevi tetikle
        env:
          DAL: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nitro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          once=$(git rev-parse HEAD)
          git fetch origin "$DAL"
          git merge --no-edit "origin/$DAL"
          git push origin HEAD:main
          # tetik.txt içeriği main'deki önceki hâlinden farklıysa tetikle. Her tetik 2. satıra zaman damgası
          # yazar (bekçi: 'publish' + UTC zaman), böylece aynı görev tekrar istenince de içerik değişir;
          # amend/force-push edilmiş ama tetiği yeni olmayan dal ise görevi ikinci kez başlatmaz.
          if ! git diff --quiet "$once" HEAD -- tetik.txt; then
            gorev=$(head -n1 tetik.txt | tr -cd 'a-z')
            case "$gorev" in
              plan|check|probe|report|publish) gh workflow run instagram.yml --ref main -f task="$gorev" ;;
            esac
          fi
