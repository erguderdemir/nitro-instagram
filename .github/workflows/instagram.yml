name: Instagram otomasyonu

on:
  schedule:
    - cron: "2,17,32,47 6-19 * * *"   # 09:02–22:47 TR, 15 dakikada bir: zamanı gelen paylaşımı yayınla
    - cron: "10 1 * * *"        # 04:10 TR: siteyi tara, takvimi ve görselleri yenile
  workflow_dispatch:
    inputs:
      task:
        description: "Görev"
        type: choice
        default: check
        options: [check, plan, publish, probe, report]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      CHROME_BIN: google-chrome
      GOREV: ${{ inputs.task }}
      ZAMANLAMA: ${{ github.event.schedule }}
    steps:
      # Kuyrukta bekleyen çalışma, tetiklendiği andaki eski commit'i değil main'in o anki hâlini almalı;
      # yoksa önceki çalışmanın yayınladığı kaydı 'planned' görür ve aynı paylaşımı ikinci kez yayınlar.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache/img
          key: img-${{ github.run_id }}
          restore-keys: img-
      - name: Görevi çalıştır
        run: python scripts/gorev.py
      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "nitro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          [ -f RAPOR.md ] && git add RAPOR.md
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Otomatik: ${GOREV:-zamanlanmış} çalışması"
          # Yayın durumu kaybolursa sonraki çalışma aynı paylaşımı yeniden yayınlar: push mutlaka başarmalı.
          # Çakışmada satır bazlı birleştirme yerine takvim kayıt bazında birleştirilir (takvim_birlestir.py).
          gorev="$GOREV"; [ -z "$gorev" ] && [ "$ZAMANLAMA" = "10 1 * * *" ] && gorev=plan
          taban=theirs; [ "$gorev" = "plan" ] && taban=ours
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((i * 5)); continue; }
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main && exit 0
            else
              git show HEAD:data/calendar.json > "$RUNNER_TEMP/bizim.json"
              git show origin/main:data/calendar.json > "$RUNNER_TEMP/uzak.json"
              ata=""
              if mb=$(git merge-base HEAD origin/main) && git show "$mb:data/calendar.json" > "$RUNNER_TEMP/ata.json"; then
                ata="--ata $RUNNER_TEMP/ata.json"
              fi
              git merge --no-edit -X ours origin/main || { git add -A .; git commit --no-edit; }
              python scripts/takvim_birlestir.py "$RUNNER_TEMP/bizim.json" "$RUNNER_TEMP/uzak.json" --base "$taban" $ata
              git add -A data docs
              git diff --cached --quiet || git commit -m "Otomatik: takvim birleştirildi"
              git push origin HEAD:main && exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::Yayın durumu main'e yazılamadı; sonraki çalışma kaydı yeniden deneyebilir."
          exit 1
